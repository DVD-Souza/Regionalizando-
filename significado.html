<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/significado.css" />
    <title>Regionalizando: Seu dicionário informal regional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="shortcut icon" href="./assets/Regionalizando_logo 1.png" type="image/x-icon"/>
    <script src="./js/significado.js" defer></script>
</head>
<body>
  <div class="container_logo_botoes">
    <div class="container_logo">
      <button class="voltarIndex" onclick="telaIndex()">
        <img class="imagemLogo" src="./assets/Regionalizando_logo 1.png" alt="Logo Regionalizando"/>
      </button>

      <button class="voltarIndex" onclick="telaIndex()">
        <p class="textoLogo1">Regionalizando</p>
        <p class="textoLogo2">Dicionário Informal Regional</p>
      </button>
    </div>

    <div class="botoes">
      <button type="button" class="botoes_header" id="botaoLogin">
  Login
  <img class="userImage" src="./assets/User.png">
</button>
       <div class="perfil-container">
    <button type="button" class="botoes_header" id="botaoPerfil">
        Cadastrar
        <img class="menuImage" src="./assets/badge.png" alt="Cadastrar" />
    </button>

    <ul id="menuPerfil" class="menu-dropdown hidden"></ul>
</div>
    </div>

  </div>

  <div class="container_pesquisa_add" id="barraDePesquisa">
    <input class="input_buscar" placeholder="Procure uma palavra" type="text" name="buscar" id="buscar"/>

    <img class="buscarimg" src="./assets/Vector.png" alt="imagem lupa" />

    <button type="button" class="adicionarTermo" onclick="telaAdicionar()">
      <img class="maisimg" src="./assets/Add@2x.png" alt="Imagem mais">
    </button>

  </div>

  <div class="texto_addcomentario">
    <p class="Titulo"></p>

    <button type="button" class="addcomentario" onclick="abrirmodal()">
      Adicionar novo significado
    </button>
  </div>

  <!-- CONTAINER VAZIO PARA SIGNIFICADOS DINÂMICOS -->
  <div class="container_significados" id="containerSignificados">
    <!-- Os significados carregados via JS serão inseridos aqui -->
  </div>

  <div class="container_botao_vermais">
    <button type="button" id="btnVerMais">Ver mais</button>
  </div>


  <!-- Modal -->
  <div id="modalSignificado" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>

      <h2 id="modalPalavra">Palavra</h2>

      <p><strong>Tipo:</strong> <span id="modalTipo"></span></p>

      <p><strong>Descrição:</strong> <span id="modalDescricao"></span></p>

      <p><strong>Região:</strong> <span id="modalRegiao"></span></p>

      <p><strong>Usuário:</strong> <span id="modalUsuario"></span></p>

    </div>
  </div>


  
</body>
</html>
