<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/significado.css" />
    <title>Regionalizando: Seu dicionário informal regional</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="shortcut icon"
      href="./assets/Regionalizando_logo 1.png"
      type="image/x-icon"
    />
    <script src="./js/significado.js" defer></script>
</head>
<body>
  <div class="container_logo_botoes">
    <div class="container_logo">
      <button class="voltarIndex" onclick="telaIndex()">
        <img
          class="imagemLogo"
          src="./assets/Regionalizando_logo 1.png"
          alt="Logo Regionalizando"
        />
      </button>

      <button class="voltarIndex" onclick="telaIndex()">
        <p class="textoLogo1">Regionalizando</p>
        <p class="textoLogo2">Dicionário Informal Regional</p>
      </button>
    </div>

    <div class="botoes">
      <button
        type="button"
        class="botoes_header"
        id="botaoLogin"
        onclick="telaLogin()"
      >
        Login
        <img class="userImage" src="./assets/User.png" />
      </button>
      <button
        type="button"
        class="botoes_header"
        id="botaoPerfil"
        onclick="mostrarMensagem()"
      >
        Menu
        <img
          class="menuImage"
          src="./assets/Hamburguer.png"
          alt="3 tracinhos menu"
        />
      </button>
    </div>
  </div>

  <div class="container_pesquisa_add" id="barraDePesquisa">
    <input
      class="input_buscar"
      placeholder="Procure um termo"
      type="text"
      name="buscar"
      id="buscar"
    />
    <img class="buscarimg" src="./assets/Vector.png" alt="imagem lupa" />
    <img class="maisimg" src="./assets/Add@2x.png" alt="Imagem mais" />
  </div>

  <div class="texto_addcomentario">
    <p class="Titulo"></p>
    <button
      type="button"
      class="addcomentario"
      onclick="abrirmodal()"
    >
      Adicionar Comentario
    </button>
  </div>

  <!-- CONTAINER VAZIO PARA SIGNIFICADOS DINÂMICOS -->
  <div class="container_significados" id="containerSignificados">
    <!-- Os significados carregados via JS serão inseridos aqui -->
  </div>

  <div class="container_botao_vermais">
    <button type="button" id="btnVerMais">Ver mais</button>
  </div>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <button class="fechar" onclick="fecharModal()">X</button>
      <div class="modal_background">
        <h2 class="titulo">ESCREVER NOVA DEFINIÇÃO</h2>

        <form action="">
          <textarea
            maxlength="500"
            cols="30"
            rows="5"
            class="escreverSignificado"
            name="escreverSignificado"
            placeholder="Comente aqui adicionando seu próprio significado."
            id="significado"
          ></textarea>

          <div class="container_classe_regiao">
            <div class="classe_regiao">
              <label for="classeGramatical" class="label_classe_regiao">
                Adicione a classe gramatical da palavra:
              </label>
              <select id="tipo" name="classeGramatical">
                <option value="Todos">Todos</option>
                <option value="Substantivo">Substantivo</option>
                <option value="Adjetivo">Adjetivo</option>
                <option value="Artigo">Artigo</option>
                <option value="Pronome">Pronome</option>
                <option value="Numeral">Numeral</option>
                <option value="Verbo">Verbo</option>
                <option value="Advérbio">Advérbio</option>
                <option value="Preposição">Preposição</option>
                <option value="Conjunção">Conjunção</option>
                <option value="Interjeição">Interjeição</option>
              </select>
            </div>

            <div class="classe_regiao">
              <label for="regiao" class="label_classe_regiao">
                Qual a região que utiliza essa gíria:
              </label>
              <select id="regiao" name="regiao">
                <option value="Todos">Todos</option>
                <option value="Nordeste">Nordeste</option>
                <option value="Norte">Norte</option>
                <option value="Sul">Sul</option>
                <option value="Sudeste">Sudeste</option>
                <option value="Centro-Oeste">Centro-Oeste</option>
              </select>
            </div>
          </div>

          <div class="termos">
            <p>
              Significados estão sujeitos aos nossos
              <a href="#" class="termosepolitica"> termos de serviço</a> e
              <a href="#" class="termosepolitica"> políticas de privacidade.</a>
            </p>
          </div>

          <button class="enviar">Enviar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
