<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="shortcut icon" href="./assets/Regionalizando_logo 1.png" type="image/x-icon">
    <title>Login</title>
    <script src="./js/login.js" defer></script>
</head>

<body>
    <div class="background">
        <div class="containerForm">
            <h1 class="mensagem_login">Login</h1>
            <form id="form">
                <div>
                    <img src="./assets/email.png" alt="Imagem usuario">
                    <label class="labels" for="usuario">Email*</label></br>
                    <input type="email" name="" id="inputemail" class="inputs">
                </div>
                <div>
                    <img src="./assets/chave.png" alt="Imagem usuario">
                    <label class="labels" for="usuario">Senha*</label></br>
                    <input type="password" name="senha" id="inputsenha" class="inputs">
                    <button type="button" class="icone_olho_fechado" id="iconeolho" onclick="olhoAtual()">
                        <img id="olho" src="./assets/olhofechado.png" title="Aperte para mostrar a senha" alt="Ícone olho fechado">
                    </button>
                    <button class="jatemconta" onclick="telaLogin()">Esqueceu a senha?</button>
                </div>
                <button type="submit" class="enviar" id="enviar">Enviar</button>
            </form>
            
            <div class="container_naotemconta">
                <span class="naotemconta">
                    Não tem uma conta?
                </span>
                <button class="seregistre" onclick="paginaRegistro()">
                    <span class="naotemconta" id="registre">
                        Registre-se
                    </span>
                </button>
            </div>
        </div>
    </div>
</body>

<script>
    
</script>

</html>
